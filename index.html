<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#870002" />
    <title>Graduation — Thu Trang</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="presentation" aria-label="Thiệp mời lễ tốt nghiệp Thu Trang">
      <div class="stage" id="stage" data-screen="0">
        <section class="screen screen-cover is-active" aria-label="Thiệp tốt nghiệp" aria-hidden="false">
          <img class="screen-art" src="assets/cover.png" alt="Thiệp mời lễ tốt nghiệp Thu Trang" />
          <button class="hotspot cover-next" data-go="1" aria-label="Mở sơ đồ"></button>
        </section>

        <section class="screen screen-map" aria-label="Sơ đồ đường vào" aria-hidden="true">
          <img class="screen-art" src="assets/map.png" alt="Sơ đồ đường vào FPT University HCM, tầng G" />
          <button class="hotspot map-prev" data-go="0" aria-label="Quay lại thiệp mời"></button>
          <button class="hotspot map-next" data-go="2" aria-label="Xem thông tin liên hệ"></button>
        </section>

        <section class="screen screen-contact" aria-label="Thông tin liên hệ" aria-hidden="true">
          <img class="screen-art" src="assets/contact.png" alt="Thông tin liên hệ và thời gian làm lễ của Thu Trang" />
          <button class="hotspot contact-prev" data-go="1" aria-label="Quay lại sơ đồ"></button>
        </section>

        <div class="screen-status" aria-live="polite" aria-atomic="true">Màn hình 1 trên 3</div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
